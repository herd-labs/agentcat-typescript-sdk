name: Continuous Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-node-versions:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      - name: Run ESLint code quality checks
        run: pnpm run lint

      - name: Run test suite
        run: pnpm run test

      - name: Build TypeScript project
        run: pnpm run build

  # Churn detector for the effect/unstable/* namespace the agentcat/effect
  # entry builds on: pins the oldest supported beta and floats the latest
  # beta dist-tag (docs/plans/effect-mcp-support.md, phase 4).
  test-effect-beta-matrix:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        effect-version: ["4.0.0-beta.85", "4.0.0-beta.94", "beta"]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Pin effect ${{ matrix.effect-version }}
        run: pnpm add -D effect@${{ matrix.effect-version }}

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      - name: Build package
        run: pnpm run build

      - name: Run effect integration suites
        run: pnpm vitest run src/tests/effect-

  test-coverage-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run test suite with code coverage analysis
        run: pnpm run test --coverage

      - name: Upload code coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
